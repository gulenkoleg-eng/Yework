# YEWORK — запуск усього стеку на власному сервері.
# 1) cp .env.example .env   і змініть паролі та домен
# 2) docker compose up -d --build
# 3) docker compose logs api   (знайдіть "КЛЮЧ ВСТАНОВЛЕННЯ")
# 4) відкрийте https://ВАШ_ДОМЕН/install
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yework}
      POSTGRES_USER: ${POSTGRES_USER:-yework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Вкажіть POSTGRES_PASSWORD у файлі .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./config:/app/config     # файл конфігурації та блокування інсталятора
      - ./storage:/app/storage   # завантажені файли

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}
  caddyconfig: {}
